name: Ruff
on:
  push:
  pull_request:
    branches:
      - develop
      - main
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync project
        run: uv sync --locked
      - name: Check lint
        run: uv run --locked ruff check src
      - name: Check formatting
        run: uv run --locked ruff format --check src
