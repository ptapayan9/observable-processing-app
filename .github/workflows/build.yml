name: Build
on:
  push:
  pull_request:
    branches:
      - develop
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Lock project
        run: uv lock --check
      - name: Build project
        run: uv build
      - name: Create clean environment
        run: uv venv --python 3.13 "$RUNNER_TEMP/package-smoke-venv"
      - name: Install built wheel
        run: >
          uv pip install --python "$RUNNER_TEMP/package-smoke-venv/bin/python" dist/*.whl

      - name: Smoke-test installed command
        working-directory: ${{ runner.temp }}
        run: "$RUNNER_TEMP/package-smoke-venv/bin/oba"
